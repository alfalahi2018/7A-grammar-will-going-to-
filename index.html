<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Going to or Will? – Unit 3 Lesson 3</title>
<style>
:root{--bg1:#e0f4ff;--bg2:#fff1d6;--card:#ffffff;--ink:#1f2a44;--mut:#5b6785;--g:#ff7a3d;--w:#1fa3a3;--ok:#1e9e5a;--no:#e04545;--line:#d8e2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#10223d;--bg2:#2a1f33;--card:#1c2a47;--ink:#eef3ff;--mut:#a9b7d6;--line:#34466b}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;flex-direction:column}
#bar{height:7px;background:var(--line)}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--w));transition:width .4s}
main{flex:1;overflow-y:auto;padding:18px 14px}
.s{max-width:900px;margin:0 auto;animation:in .45s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(30px,7vw,52px);margin:.2em 0}h2{font-size:clamp(22px,4.5vw,32px);margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px;font-size:17px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.gt{border-top:8px solid var(--g)}.wl{border-top:8px solid var(--w)}
.gt h3{color:var(--g)}.wl h3{color:var(--w)}h3{margin:0 0 6px;font-size:24px}
.ex{background:rgba(120,150,200,.15);border-radius:12px;padding:8px 10px;margin:6px 0}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(135deg,var(--g),#ff4f7b);color:#fff;border:0;border-radius:30px;padding:12px 26px;font-weight:700;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(3px);box-shadow:none}
.cover{text-align:center;padding-top:6vh}.big{font-size:80px;animation:fl 3s infinite ease-in-out}
@keyframes fl{50%{transform:translateY(-14px) rotate(6deg)}}
.tag{display:inline-block;background:var(--w);color:#fff;border-radius:20px;padding:4px 14px;font-weight:700;font-size:14px}
.menu{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mc{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px 8px;text-align:center;font-weight:700;font-size:18px;color:var(--ink);transition:.2s}
.mc:hover{transform:translateY(-5px) rotate(-1deg);border-color:var(--g)}.mc span{display:block;font-size:42px}
.q{margin:12px 0}.q p{font-weight:700;font-size:18px;margin:0 0 8px}
.o{display:inline-block;margin:4px 6px 4px 0;padding:9px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:17px}
.o:hover{border-color:var(--w)}.o.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:pop .4s}.o.no{background:var(--no);color:#fff;border-color:var(--no);animation:sh .35s}
@keyframes pop{50%{transform:scale(1.15)}}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{font-size:16px;margin-top:6px;color:var(--mut)}
.ch{display:inline-block;background:#ffe9b8;color:#5a3b00;border-radius:20px;padding:6px 12px;margin:3px;font-size:16px}
input[type=text]{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:4px 0}
.nav{display:flex;gap:8px;justify-content:space-between;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.nav button{background:var(--bg1);color:var(--ink);border:2px solid var(--line);border-radius:20px;padding:9px 16px;font-weight:700}
.nav button:disabled{opacity:.35}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.mt{grid-template-columns:1fr}}
.mt button{display:block;width:100%;text-align:left;margin:5px 0;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.mt button.sel{border-color:var(--g);background:#fff0e6;color:#222}.mt button.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.flow{text-align:center;font-size:20px;font-weight:700}.flow b{display:inline-block;padding:10px 18px;border-radius:16px;color:#fff;margin:6px}
.cr{text-align:center;color:var(--mut);font-size:13px;margin:18px 0 4px}
</style></head><body>
<div id="bar"><i></i></div><main><div class="s" id="v"></div></main>
<div class="nav"><button id="pv">◀ Previous</button><button id="mn">☰ Menu</button><button id="nx">Next ▶</button></div>
<script>
const $=s=>document.querySelector(s);
const CR='<div class="cr">Khawlah Bint Thalabah (5-9) • Created by T.Badria Alfalahi</div>';
const SETS={
a1:[{p:"You bought your tickets online. “We ______ to the cinema later.”",o:["won't go","are going to go","goes"],a:1,w:"The tickets are already bought, so it is a plan. We use going to."},
{p:"Your friend has two heavy suitcases. You offer: “Wait! I ______ help you.”",o:["'ll","'m going","does"],a:0,w:"Offering help is a decision at the moment of speaking: I'll + verb."}],
a2:[{p:"We use going to for plans we have already decided.",o:["✔ True","✘ False"],a:0,w:"Going to is for plans: I'm going to visit London."},
{p:"The negative of will is “willn't”.",o:["✔ True","✘ False"],a:1,w:"The negative of will is won't: She won't look for it now."},
{p:"“It's late. I think I'll go to bed now” shows a quick decision.",o:["✔ True","✘ False"],a:0,w:"The speaker decides at the moment of speaking, so we use will."}],
a3:[{p:"I'm hungry. I think I ______ make a sandwich.",a:0,w:"A quick decision made while speaking."},
{p:"We ______ go to the cinema later. We bought tickets online.",a:1,w:"A plan: the tickets are already bought."},
{p:"Omaima ______ play basketball today. She has a swimming lesson.",a:2,w:"A negative plan: she already has a swimming lesson."},
{p:"Don't worry about your trip. You ______ have any problems.",a:3,w:"A promise about the future."}].map(x=>({...x,o:["'ll","are going to","isn't going to","won't"]})),
a6:[{p:"We are going go to the cinema later.",o:["We are going to go to the cinema later.","We are go to the cinema later."],a:0,w:"Do not forget “to”: going to + verb."},
{p:"She willn't help you with the suitcases.",o:["She won't help you with the suitcases.","She not will help you."],a:0,w:"The negative of will is won't."},
{p:"I will to take a small bag, too.",o:["I'll take a small bag, too.","I'll to take a small bag, too."],a:0,w:"After will we use the base verb, with no “to”."}],
qz:[{p:"We have tickets. We ______ watch Bassam on Saturday.",o:["are going to","will","won't"],a:0,w:"The tickets are bought: a plan."},
{p:"The negative of will is ______.",o:["willn't","won't","not will"],a:1,w:"won't is the negative of will."},
{p:"True or False: “I think I'll go to bed now” is a quick decision.",o:["True","False"],a:0,w:"A quick decision uses will."},
{p:"Omaima ______ play basketball today. She has a swimming lesson.",o:["isn't going to","won't","doesn't"],a:0,w:"A negative plan: she has a lesson."},
{p:"If you wait a minute, I ______ help you.",o:["will","am going to","going"],a:0,w:"An offer to help right now."}]};
let score=0,done=0;
function qs(k,quiz){return SETS[k].map((q,i)=>`<div class="card q"><p>${i+1}. ${q.p}</p>${q.o.map((o,j)=>`<button class="o" onclick="ans(this,'${k}',${i},${j},${quiz?1:0})">${o}</button>`).join('')}<div class="fb"></div></div>`).join('')}
function ans(b,k,i,j,quiz){const q=SETS[k][i],c=b.parentNode;if(c.dataset.d)return;const fb=c.querySelector('.fb');
if(j==q.a){b.classList.add('ok');c.dataset.d=1;fb.innerHTML='✅ '+q.w;if(quiz&&!c.dataset.m)score++;if(quiz){done++;fin()}}
else{b.classList.add('no');b.disabled=true;c.dataset.m=1;fb.innerHTML='Try again! 💪'}}
function fin(){if(done>=5)$('#res').innerHTML=`<div class="card" style="text-align:center;font-size:22px"><b>${score} out of 5</b><br>${score==5?'Excellent! You are a grammar star 🌟':score>=3?'Very good! Review the explanation.':'Good try! Watch the explanation again ▶'}</div>`}
let sel=null,mdone=0;
const M=[["I'm going to visit London.","c"],["Wait! I'll help you.","d"],["It's late. I think I'll go to bed.","a"],["We aren't going to take a guidebook.","e"],["I won't forget your birthday!","b"]];
const U={a:"a decision at the moment of speaking",b:"a promise",c:"a plan decided before",d:"an offer",e:"a negative plan"};
function ms(b){if(b.classList.contains('done'))return;document.querySelectorAll('#ml .sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b}
function mu(b,u){if(!sel)return;if(sel.dataset.a==u){sel.classList.remove('sel');sel.classList.add('done');sel.innerHTML+=' → '+u+')';sel=null;mdone++;if(mdone==5)$('#mf').innerHTML='🎉 Perfect match!'}else{b.classList.add('sel');setTimeout(()=>b.classList.remove('sel'),400);$('#mf').innerHTML='Not quite. Try again!'}}
const act=(n,t,s,body)=>`<div class="s"><span class="tag">Activity ${n}</span><h2>${t}</h2><p class="sub">${s}</p>${body}</div>`;
const gt=t=>`<span style="color:var(--g);font-weight:700">${t}</span>`,wl=t=>`<span style="color:var(--w);font-weight:700">${t}</span>`;
const P=[
()=>`<div class="cover"><div class="big">✈️</div><span class="tag">UNIT 3: TRAVEL • LESSON 3 • GRAMMAR</span><h1>Going to or Will? 🗓️</h1><p class="sub">Talking about the future<br>Interactive lesson • English • Grade 7<br>Class Book 7A • Lesson 3 • practice page 45</p><button class="btn" onclick="go(1)">Start the lesson ▶</button>${CR}</div>`,
()=>`<h2>Main Menu</h2><p class="sub">Click any card to jump to a section</p><div class="menu">${[["🎯","Objectives",2],["💭","Warm-up",3],["📖","Explanation",4],["🗺️","Infographic",6],["🎮","Activities",7],["📝","Final Quiz",13],["⭐","Summary",14]].map(m=>`<button class="mc" onclick="go(${m[2]})"><span>${m[0]}</span>${m[1]}</button>`).join('')}</div>`,
()=>`<h2>🎯 Lesson Objectives</h2><p class="sub">By the end of this lesson, I can:</p>${["Use going to for plans I have already decided.","Use will for quick decisions, offers and promises.","Choose the correct form in a sentence.","Write about my own plans for the weekend."].map((t,i)=>`<div class="card">${['🗓️','💡','✍️','📝'][i]} <b>${i+1}.</b> ${t}</div>`).join('')}`,
()=>`<h2>💭 Warm-up: A Real-Life Situation</h2><p class="sub">Think – Pair – Share</p><div class="card">🧳 Your family has booked a trip to Salalah for next week. At the airport, you notice that you forgot your phone charger!</div><div class="grid"><div class="card gt">What have you already planned?<br><i>(We're going to …)</i></div><div class="card wl">What do you decide right now?<br><i>(I'll …)</i></div></div><div class="card">Which form did you use each time? Why?<div class="ex">Majid: “I'm going to take a small rucksack.”</div><div class="ex">Frank: “I'll take a small bag, too.”</div>Why are the forms different?</div>`,
()=>`<h2>📖 Going to or Will?</h2><p class="sub">Two ways to talk about the future</p><div class="grid"><div class="card gt"><h3>GOING TO</h3><b>Use it for:</b> plans and things you have already decided<p><b>Form:</b> am / is / are + going to + verb</p><div class="ex">✔ I'm going to visit London.</div><div class="ex">✔ She's going to take a guidebook.</div><div class="ex">✘ We aren't going to take a guidebook.</div><small>Clues: tomorrow • next week • on Saturday • tickets bought</small></div><div class="card wl"><h3>WILL</h3><b>Use it for:</b> quick decisions, offers and promises at the moment of speaking<p><b>Form:</b> 'll / will / won't + verb</p><div class="ex">✔ I'll take a small bag, too.</div><div class="ex">✔ I'll look for it now.</div><div class="ex">✘ She won't look for it now.</div><small>Clues: I think I'll … • Wait! • now</small></div></div>`,
()=>`<h2>🇴🇲 Examples from Oman</h2><p class="sub">Same future, different reasons</p><div class="grid"><div class="card gt"><h3>🏖️ PLAN → going to</h3><b>Family trip to Salalah</b><div class="ex">“We're going to visit Salalah next week.”</div>The hotel is already booked. We decided before speaking.</div><div class="card wl"><h3>🌧️ DECISION NOW → will</h3><b>Sudden rain in Muscat</b><div class="ex">“It's raining! I'll take an umbrella.”</div>You decide at the moment of speaking.</div><div class="card wl"><h3>🛄 OFFER → will</h3><b>At Muscat Airport</b><div class="ex">“Wait, I'll carry your suitcase.”</div>You offer to help right now.</div></div><div class="card">🗣️ <b>Your turn:</b> say one plan and one quick decision about your weekend.</div>`,
()=>`<h2>🗺️ Infographic: Which One Do I Use?</h2><p class="sub">Ask yourself one question</p><div class="card flow">Did you decide BEFORE you spoke?<br><b style="background:var(--g)">YES → GOING TO</b><b style="background:var(--w)">NO → WILL</b></div><div class="grid"><div class="card gt">📅 Plans and intentions<br>🎟️ Already prepared: tickets, bookings<div class="ex">🗣️ I'm going to visit London.</div></div><div class="card wl">⚡ Quick decisions<br>🤝 Offers and promises<div class="ex">💭 “I think I'll go to bed now.”</div></div></div><div class="card">${gt('going to')}: I'm / aren't going to + verb &nbsp; ${wl('will')}: I'll / I won't + verb</div>`,
()=>act(1,'Choose the Correct Answer','Multiple choice • tap your answer',qs('a1')),
()=>act(2,'True or False?','Read each sentence, then choose True or False',qs('a2')),
()=>act(3,'Complete the Sentence','Choose the correct form from the box: <b>\'ll • are going to • isn\'t going to • won\'t</b>',qs('a3')),
()=>act(4,'Match','Tap a sentence, then tap its use','<div class="mt card"><div id="ml">'+M.map(m=>`<button data-a="${m[1]}" onclick="ms(this)">${m[0]}</button>`).join('')+'</div><div>'+Object.entries(U).map(u=>`<button onclick="mu(this,'${u[0]}')">${u[0]}) ${u[1]}</button>`).join('')+'</div></div><div id="mf" class="fb" style="font-size:20px"></div>'),
()=>act(5,'Think','Write about your own plans. There is no single answer!',`<div class="card">It is Friday evening. Your cousin calls: “What are you doing this weekend?”<div>${["👵 visit grandparents","🏖️ go to the beach","📚 do homework","⚽ watch football","🛍️ go shopping","🚴 go cycling","🏛️ visit a museum","🎮 play games","🍳 cook dinner","🧹 help at home","📖 read a book","🧺 go to the souq"].map(c=>`<span class="ch">${c}</span>`).join('')}</div></div><div class="card">This weekend, I'm going to ______.<input type="text" placeholder="Plan 1 (going to)"><input type="text" placeholder="Plan 2 (going to)">If you call me, I'll ______.<input type="text" placeholder="Offer or quick decision (will)"><details><summary><b>✅ Sample answers</b></summary><div class="ex">I'm going to visit my grandparents on Friday.</div><div class="ex">We're going to go to the beach on Saturday.</div><div class="ex">If you need help with your homework, I'll help you.</div>Any answer is fine if the form matches the meaning.</details></div>`),
()=>act(6,'Mistake Detective 🔍','⏱️ One minute! Find and fix the mistake in each sentence',qs('a6')),
()=>{score=0;done=0;return act('','📝 Final Quiz','5 questions: tap the correct answer','<div id="res"></div>'+qs('qz',1))},
()=>`<h2>⭐ Lesson Summary</h2><p class="sub">What did we learn today?</p><div class="grid"><div class="card gt"><h3>GOING TO</h3>Plans decided before speaking<div class="ex">I'm going to visit London.</div><div class="ex">We aren't going to take a guidebook.</div>am / is / are + going to + verb</div><div class="card wl"><h3>WILL</h3>Quick decisions, offers, promises<div class="ex">I'll take a small bag, too.</div><div class="ex">She won't look for it now.</div>'ll or won't + verb, with no “to”</div></div><div class="card">❓ Ask: did I decide before speaking?</div>`,
()=>`<div class="cover"><div class="big">🚀</div><h1>Great plans start with the right words!</h1><p class="sub">Well done! Now you can talk about your plans and quick decisions.</p><button class="btn" onclick="go(1)">☰ Back to Menu</button> <button class="btn" onclick="go(13)">🔁 Retake the Quiz</button>${CR}</div>`];
let i=0;
function go(n){i=Math.max(0,Math.min(P.length-1,n));sel=null;mdone=0;$('#v').innerHTML=P[i]();$('#v').style.animation='none';void $('#v').offsetWidth;$('#v').style.animation='';$('main').scrollTop=0;$('#bar i').style.width=(i/(P.length-1)*100)+'%';$('#pv').disabled=i==0;$('#nx').disabled=i==P.length-1}
$('#pv').onclick=()=>go(i-1);$('#nx').onclick=()=>go(i+1);$('#mn').onclick=()=>go(1);go(0);
</script></body></html>
